<html lang="en">
<head>

<style>
:root{color-scheme:light dark;--paper:light-dark(#f7f4ed,#1c211e);--surface:light-dark(#fffdf8,#272d29);--ink:light-dark(#263b32,#f3f0e7);--muted:light-dark(#778078,#aab4aa);--line:light-dark(#e5e0d4,#414942);--green:light-dark(#355b49,#9bc7a6);--green-dark:light-dark(#294b3b,#1f392d);--sage:light-dark(#e6eee4,#34463a);--peach:light-dark(#f6e4d6,#533d32);--gold:light-dark(#f1e8ca,#4d462f);--red:light-dark(#b63f35,#ff9388);--redbg:light-dark(#fff0ed,#4a2927);--shadow:0 8px 28px #332c1b0a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--paper);padding:0 0 36px}.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:16px max(18px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;display:grid;place-items:center;background:var(--green-dark);color:#fff8e9;border-radius:14px;font-size:23px}.brand h1{font-family:Georgia,serif;font-size:25px;line-height:1;margin:0;letter-spacing:-.6px}.brand p{margin:5px 0 0;color:var(--muted);font-size:12px;letter-spacing:.3px}.alpha{font-size:11px;text-transform:uppercase;letter-spacing:1px;border:1px solid var(--line);padding:6px 9px;border-radius:20px;color:var(--muted);white-space:nowrap}.wrap{max-width:1180px;margin:auto;padding:25px 20px}.welcome{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px}.eyebrow{color:var(--green);font-weight:750;text-transform:uppercase;letter-spacing:1.6px;font-size:10px}.welcome h2{font:clamp(27px,4vw,38px)/1.12 Georgia,serif;margin:7px 0 7px;letter-spacing:-.6px}.welcome p{margin:0;color:var(--muted);max-width:560px}.primary,.secondary,.quiet,.tab{border:0;border-radius:11px;padding:11px 15px;font-weight:700;transition:transform .15s,opacity .15s}.primary{background:var(--green-dark);color:#fff9ee;box-shadow:0 3px 0 #1b3628}.primary:active,.secondary:active{transform:translateY(1px)}.secondary{background:var(--sage);color:var(--ink);border:1px solid var(--line)}.quiet{background:transparent;color:var(--muted);padding:8px 10px}.tabs{display:flex;gap:7px;padding:6px;background:light-dark(#eeeae0,#242a26);border:1px solid var(--line);border-radius:15px;margin-bottom:22px;overflow-x:auto}.tab{flex:1;min-width:130px;background:transparent;color:var(--muted);text-align:left;display:flex;align-items:center;gap:9px;justify-content:center}.tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}.tab .num{font-size:11px;min-width:22px;height:22px;display:grid;place-items:center;background:var(--sage);border-radius:8px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px 18px}.stat .label{color:var(--muted);font-size:12px}.stat strong{display:block;font:28px/1.2 Georgia,serif;margin:6px 0}.stat small{font-size:11px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px}.sectionhead h3{font:23px Georgia,serif;margin:0}.sectionhead p{margin:3px 0 0;color:var(--muted);font-size:12px}.filters{display:flex;gap:8px;align-items:center}.filters input,.filters select{max-width:190px}.field, input,select,textarea{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none}.field:focus,input:focus,select:focus,textarea:focus{border-color:var(--green)}.list{display:grid;gap:10px}.job{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:17px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;box-shadow:var(--shadow)}.job.overdue{border-color:var(--red);background:linear-gradient(100deg,var(--redbg),var(--surface) 70%)}.jobtitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.jobtitle h4{margin:0;font-size:16px}.meta{color:var(--muted);font-size:12px;margin-top:5px}.desc{margin:10px 0 0;font-size:13px;color:var(--ink)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{border-radius:20px;padding:4px 8px;font-size:10px;font-weight:750;background:var(--sage);color:var(--ink)}.chip.peach{background:var(--peach)}.chip.gold{background:var(--gold)}.chip.danger{background:var(--redbg);color:var(--red)}.jobright{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:12px;min-width:120px}.price{font:24px Georgia,serif;white-space:nowrap}.pricehint{font-size:10px;color:var(--muted);margin-top:2px;text-align:right}.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.actions button{font-size:12px;padding:8px 10px}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.foot{margin-top:24px;color:var(--muted);font-size:11px;text-align:center}.overlay{position:fixed;inset:0;background:#17241dcc;z-index:5;display:grid;place-items:end center;padding:0;overflow:auto}.modal{background:var(--paper);width:min(100%,560px);max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px #0002}.modalhead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.modal h3{font:27px Georgia,serif;margin:0}.modal p{margin:5px 0 0;color:var(--muted);font-size:13px}.close{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formrow{display:grid;gap:6px}.formrow.full{grid-column:1/-1}.formrow label{font-size:12px;font-weight:750;color:var(--muted)}.modalfoot{display:flex;gap:8px;margin-top:20px}.modalfoot button{flex:1}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fff9ee;border-radius:30px;padding:12px 18px;z-index:10;box-shadow:var(--shadow);font-size:13px;max-width:calc(100% - 30px);text-align:center}.hidden{display:none!important}.dategroup{margin-top:16px}.dateheading{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:800;margin:0 0 9px 3px;display:flex;justify-content:space-between}.dateheading span{letter-spacing:0;text-transform:none;font-weight:600}.introline{font-size:13px;color:var(--muted);margin:-5px 0 15px}.pillbtn{border-radius:30px}.smallnote{color:var(--muted);font-size:11px;margin-top:12px}
@media(min-width:760px){.overlay{place-items:center;padding:24px}.modal{border-radius:22px;padding:26px}.job{padding:19px 21px}.tabs{max-width:750px}.tab{justify-content:flex-start;padding:13px 18px}.wrap{padding-top:32px}}@media(max-width:560px){.topbar{padding:13px 16px}.brand h1{font-size:23px}.alpha{font-size:9px}.wrap{padding:21px 14px}.welcome{align-items:flex-start;flex-direction:column}.welcome .primary{width:100%}.stats{gap:8px}.stat{padding:13px 11px}.stat strong{font-size:24px}.stat .label{font-size:10px}.stat small{font-size:10px}.job{grid-template-columns:minmax(0,1fr);gap:12px;padding:15px}.jobright{align-items:flex-start;flex-direction:row;flex-wrap:wrap}.pricehint{text-align:left}.actions{justify-content:flex-start}.sectionhead{align-items:flex-start;flex-direction:column}.filters{width:100%}.filters input{max-width:none}.filters select{max-width:140px}.formgrid{grid-template-columns:1fr 1fr}.modal{padding-left:17px;padding-right:17px}}
</style></head>
<body><div class="app" id="app"><header class="topbar"><div class="brand"><div class="mark" aria-hidden="true">☕</div><div><h1>TeaBreak</h1><p>KETTLE & CRUMB · KILKENNY</p></div></div><span class="alpha">Internal alpha · v0.1</span></header><main class="wrap"><section class="welcome"><div><div class="eyebrow">A little more time for the good stuff</div><h2>Good morning, team.</h2><p>One calm place for every order, quote and catering date. Less phone tag, more time for the bake.</p></div><button class="primary" id="newOrderBtn">＋ Add online order</button></section><div class="stats" id="stats"></div><nav class="tabs" aria-label="Team views"><button class="tab active" data-view="niamh"><span>🧾</span> Niamh <span class="num" id="count-niamh">0</span></button><button class="tab" data-view="tomas"><span>✳</span> Tomas <span class="num" id="count-tomas">0</span></button><button class="tab" data-view="paddy"><span>▦</span> Paddy <span class="num" id="count-paddy">0</span></button></nav><section id="view"></section><div class="foot">Made for the people behind the counter · Changes save on this device</div></main></div><div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const KEY='teabreak-kettle-crumb-alpha-v1';const DAY=86400000;const ago=n=>new Date(Date.now()-n*DAY).toISOString();const future=n=>new Date(Date.now()+n*DAY).toISOString().slice(0,10);const euro=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0);const niceDate=s=>new Date(s).toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'});const daysOld=s=>Math.max(0,Math.floor((Date.now()-new Date(s).getTime())/DAY));const overdue=j=>daysOld(j.createdAt)>3;const uid=()=>Math.random().toString(36).slice(2,9);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=[
{id:'TB-104',view:'niamh',name:'Aoife Murphy',title:'Office lunch boxes',type:'Online order',detail:'12 lunch boxes · 6 veggie · delivery to Parliament Street',guests:12,price:156,createdAt:ago(0),due:future(1),status:'New',phone:'056 000 0104'},
{id:'TB-103',view:'niamh',name:'Kilkenny Arts Hub',title:'Coffee & scone platter',type:'Online order',detail:'2 large coffee flasks, 24 scones, butter & jam',guests:18,price:98,createdAt:ago(1),due:future(2),status:'Confirmed',phone:'056 000 0103'},
{id:'TB-102',view:'niamh',name:'Sarah Doyle',title:'Birthday cake collection',type:'Online order',detail:'Chocolate sponge, 10 inch · “Happy 40th Sarah”',guests:16,price:65,createdAt:ago(4),due:future(0),status:'Needs attention',phone:'056 000 0102'},
{id:'TB-101',view:'tomas',name:'Gráinne Walsh',title:'Wedding day tea station',type:'Catering quote',detail:'Tea & coffee station, mini pastries and traybakes',guests:85,price:680,suggested:680,createdAt:ago(5),due:future(24),status:'Awaiting quote',phone:'056 000 0101',history:'Similar 70–100 guest event: €8 per guest'},
{id:'TB-100',view:'tomas',name:'Briarstone Consulting',title:'Breakfast meeting',type:'Catering quote',detail:'Breakfast rolls, fruit, pastries and coffee',guests:32,price:288,suggested:288,createdAt:ago(2),due:future(8),status:'Awaiting quote',phone:'056 000 0100',history:'Similar 25–40 guest breakfast: €9 per guest'},
{id:'TB-099',view:'tomas',name:'Kilkenny Community School',title:'End-of-term tea & treats',type:'Catering quote',detail:'Tea, coffee, traybakes and gluten-free options',guests:120,price:540,suggested:540,createdAt:ago(3),due:future(12),status:'Awaiting quote',phone:'056 000 0099',history:'Similar 100–150 guest tea break: €4.50 per guest'},
{id:'TB-098',view:'paddy',name:'The Smithwick Family',title:'Communion afternoon tea',type:'Booked catering',detail:'Sandwich selection, scones, mini desserts & tea',guests:45,price:495,createdAt:ago(2),due:future(3),status:'Booked',phone:'056 000 0098'},
{id:'TB-097',view:'paddy',name:'Lanigan & Co.',title:'Team summer lunch',type:'Booked catering',detail:'Seasonal buffet, vegetarian mains and drinks',guests:68,price:1020,createdAt:ago(1),due:future(7),status:'Booked',phone:'056 000 0097'}
];let jobs;try{jobs=JSON.parse(localStorage.getItem(KEY))||seed}catch(e){jobs=seed}let active='niamh',search='',filter='all',toastTimer;const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];function save(){try{localStorage.setItem(KEY,JSON.stringify(jobs))}catch(e){notify('Could not save on this browser.')}}function notify(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}function counts(){return {niamh:jobs.filter(j=>j.view==='niamh').length,tomas:jobs.filter(j=>j.view==='tomas').length,paddy:jobs.filter(j=>j.view==='paddy').length}}function stats(){const c=counts(),late=jobs.filter(j=>j.view!=='paddy'&&overdue(j)).length;$('#stats').innerHTML=`<div class="stat"><div class="label">Open orders</div><strong>${c.niamh}</strong><small>Online orders to fulfil</small></div><div class="stat"><div class="label">Quotes to prepare</div><strong>${c.tomas}</strong><small>${jobs.filter(j=>j.view==='tomas'&&overdue(j)).length} waiting over 3 days</small></div><div class="stat"><div class="label">Booked ahead</div><strong>${c.paddy}</strong><small>${jobs.filter(j=>j.view==='paddy'&&Number(j.guests)>=50).length} larger events · ${late} overdue items</small></div>`;Object.entries(c).forEach(([k,v])=>$('#count-'+k).textContent=v)}
function card(j){const age=daysOld(j.createdAt),late=overdue(j)&&j.view!=='paddy';let chips=`<span class="chip">${esc(j.type)}</span><span class="chip ${j.guests>=50?'peach':''}">${j.guests} guests</span><span class="chip ${j.status==='Confirmed'||j.status==='Booked'?'gold':''}">${esc(j.status)}</span>`;if(late)chips+=`<span class="chip danger">${age} days · overdue</span>`;let actions='';if(j.view==='niamh')actions=`<button class="secondary" data-act="status" data-id="${j.id}">${j.status==='Confirmed'?'Mark ready':'Confirm order'}</button><button class="quiet" data-act="edit" data-id="${j.id}">Edit</button>`;if(j.view==='tomas')actions=`<button class="primary" data-act="approve" data-id="${j.id}">Approve ${euro(j.price)}</button><button class="secondary" data-act="editquote" data-id="${j.id}">Edit quote</button>`;if(j.view==='paddy')actions=`<button class="secondary" data-act="edit" data-id="${j.id}">View / edit</button>`;return `<article class="job ${late?'overdue':''}"><div><div class="jobtitle"><h4>${esc(j.title)}</h4><span class="meta">${esc(j.id)}</span></div><div class="meta">${esc(j.name)} · ${esc(j.phone||'No phone added')}</div><p class="desc">${esc(j.detail)}</p><div class="chips">${chips}</div>${j.view==='tomas'?`<div class="smallnote">✦ Price guide: ${esc(j.history||'Based on previous similar jobs')}</div>`:`<div class="meta" style="margin-top:10px">${j.view==='paddy'?'Event date':'Requested for'} · ${niceDate(j.due)}</div>`}</div><div class="jobright"><div><div class="price">${euro(j.price)}</div><div class="pricehint">${j.view==='tomas'?'Suggested quote':'Order total'}${j.view==='tomas'?' · '+euro(j.price/Math.max(1,j.guests))+'/guest':''}</div></div><div class="actions">${actions}</div></div></article>`}
function render(){stats();$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===active));const labels={niamh:['Open order book','Online orders, all in one place. No more missed phone notes.'],tomas:['Quote desk','Oldest requests first, with a suggested price from similar past jobs.'],paddy:['Catering calendar','Booked jobs grouped by event date and guest count.']};let arr=jobs.filter(j=>j.view===active).filter(j=>(j.title+' '+j.name+' '+j.id+' '+j.detail).toLowerCase().includes(search.toLowerCase()));if(filter==='late')arr=arr.filter(overdue);if(filter==='large')arr=arr.filter(j=>j.guests>=50);if(active==='tomas')arr.sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));else if(active==='paddy')arr.sort((a,b)=>new Date(a.due)-new Date(b.due));else arr.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));let body='';if(active==='paddy'){const groups={};arr.forEach(j=>(groups[j.due]??=[]).push(j));body=Object.keys(groups).sort().map(d=>`<div class="dategroup"><div class="dateheading">${niceDate(d)} <span>${groups[d].length} ${groups[d].length===1?'job':'jobs'}</span></div><div class="list">${groups[d].map(card).join('')}</div></div>`).join('')}else body=arr.length?`<div class="list">${arr.map(card).join('')}</div>`:'';$('#view').innerHTML=`<div class="sectionhead"><div><h3>${labels[active][0]}</h3><p>${labels[active][1]}</p></div><div class="filters"><input id="search" aria-label="Search jobs" placeholder="Search name or job…" value="${esc(search)}"><select id="filter" aria-label="Filter jobs"><option value="all" ${filter==='all'?'selected':''}>All jobs</option><option value="late" ${filter==='late'?'selected':''}>Over 3 days</option><option value="large" ${filter==='large'?'selected':''}>50+ guests</option></select></div></div>${active==='tomas'?'<p class="introline">Suggested prices are guides based on similar past jobs. Review before approving.</p>':''}${body||'<div class="empty">'+(search?'No jobs match that search.':'All clear for now. New jobs will appear here.')+'</div>'}`;$('#search').addEventListener('input',e=>{search=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)});$('#filter').addEventListener('change',e=>{filter=e.target.value;render()})}
function openModal(title,subtitle,fields,submitLabel,onSubmit){$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><div><h3 id="modalTitle">${title}</h3><p>${subtitle}</p></div><button class="close" id="closeModal" aria-label="Close">×</button></div><form id="jobForm"><div class="formgrid">${fields}</div><div class="modalfoot"><button type="button" class="secondary" id="cancelModal">Cancel</button><button type="submit" class="primary">${submitLabel}</button></div></form></section></div>`;const close=()=>$('#modalRoot').innerHTML='';$('#closeModal').onclick=close;$('#cancelModal').onclick=close;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')close()});$('#jobForm').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));onSubmit(data);close();save();render()});$('#modalTitle').focus?.()}
const field=(label,name,value='',type='text',extra='')=>`<div class="formrow ${extra}"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${['name','title','price','due','guests'].includes(name)?'required':''} ${type==='number'?'min="0"':''}></div>`;const area=(label,name,value='',extra='full')=>`<div class="formrow ${extra}"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" rows="2">${esc(value)}</textarea></div>`;
function newOrder(){openModal('Add an online order','A quick order entry, just like a customer checkout.',field('Customer name','name','','text')+field('Phone number','phone','','tel')+field('Order / occasion','title')+field('Total (€)','price','','number')+field('Collection / delivery date','due',future(2),'date')+field('Guest count / serves','guests','1','number')+area('Order details','detail','') , 'Add to order book',d=>{jobs.push({id:'TB-'+String(105+jobs.length).padStart(3,'0'),view:'niamh',type:'Online order',status:'New',createdAt:new Date().toISOString(),...d,price:Number(d.price),guests:Number(d.guests)});active='niamh';search='';filter='all';notify('Order added to Niamh’s book')})}
function editJob(j,quote=false){const f=field('Customer name','name',j.name)+field('Phone number','phone',j.phone||'','tel')+field('Job title','title',j.title)+field('Total (€)','price',j.price,'number')+field(quote?'Request received':'Event date','due',quote?j.due.slice(0,10):j.due,'date')+field('Approx. guest count','guests',j.guests,'number')+area('Job details','detail',j.detail)+field('Status','status',j.status);openModal(quote?'Edit quote':'Job details',quote?'Adjust the suggested price before approving.':'Keep the job details up to date.',f,'Save changes',d=>{Object.assign(j,d,{price:Number(d.price),guests:Number(d.guests)});if(quote)j.edited=true;notify('Changes saved')})}
$('#newOrderBtn').addEventListener('click',newOrder);$$('.tab').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.view;search='';filter='all';render()}));document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const j=jobs.find(x=>x.id===b.dataset.id);if(!j)return;switch(b.dataset.act){case'edit':editJob(j);break;case'editquote':editJob(j,true);break;case'approve':j.view='paddy';j.status='Booked';j.type='Booked catering';j.approvedAt=new Date().toISOString();active='tomas';notify('Quote approved and moved to Paddy’s booked jobs');render();save();break;case'status':j.status=j.status==='Confirmed'?'Ready for collection':'Confirmed';notify('Order status updated');render();save();break}});
render();
})();
</script></body></html>
